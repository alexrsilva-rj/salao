spring:
  application:
    name: salao-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # Evita queries JPA durante a serialização HTTP
    show-sql: false      # LGPD: desabilitado para evitar log de dados pessoais (PII) em SQL
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://192.168.18.200:8080/realms/salao-realm}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://192.168.18.200:8080/realms/salao-realm/protocol/openid-connect/certs}

# LGPD: Token de API externalizado — sobrescreva API_TOKEN_SECRET em produção
api:
  token:
    secret: ${API_TOKEN_SECRET:salao-secret-api-token-123}
logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","thread":"%t","logger":"%logger{40}","message":"%m","exception":"%ex"}%n'
  level:
    com.integra2u: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG