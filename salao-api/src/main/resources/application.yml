spring:
  application:
    name: salao-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # Evita queries JPA durante a serialização HTTP
    show-sql: false      # LGPD: desabilitado para evitar log de dados pessoais (PII) em SQL
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # OBRIGATORIO: injete via variavel de ambiente com URL HTTPS em producao
          # Exemplo: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://keycloak.exemplo.com/realms/salao-realm
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

# Token de API — deve ser injetado via variavel de ambiente API_TOKEN_SECRET (sem default)
# Em Kubernetes: use secretKeyRef apontando para um Secret com valor criptograficamente seguro
# Gere com: openssl rand -hex 32
api:
  token:
    secret: ${API_TOKEN_SECRET}
logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","thread":"%t","logger":"%logger{40}","message":"%m","exception":"%ex"}%n'
  level:
    com.integra2u: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG